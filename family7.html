<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITRI | HAMZAH N CO</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff006e;
            --neon-purple: #8338ec;
            --neon-cyan: #00f5d4;
            --neon-orange: #ff9f1c;
            --neon-yellow: #fee440;
            --dark-bg: #0a0a12;
            --card-bg: rgba(20, 20, 35, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--dark-bg);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: white;
        }

        /* ===== PARALLAX BACKGROUND LAYERS ===== */
        .parallax-layer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        .bg-grid {
            position: absolute;
            top: -20%; left: -20%;
            width: 140%; height: 140%;
            background-image: 
                linear-gradient(rgba(131, 56, 236, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(131, 56, 236, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            will-change: transform;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Blobs with parallax speeds */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            animation: blobFloat 15s ease-in-out infinite;
            will-change: transform;
        }
        .blob-1 { 
            width: 600px; height: 600px; 
            background: var(--neon-pink); 
            top: 5%; left: -10%;
            animation-delay: 0s;
        }
        .blob-2 { 
            width: 500px; height: 500px; 
            background: var(--neon-purple); 
            top: 40%; right: -10%;
            animation-delay: -5s;
        }
        .blob-3 { 
            width: 400px; height: 400px; 
            background: var(--neon-cyan); 
            top: 70%; left: 20%;
            animation-delay: -10s;
        }
        .blob-4 { 
            width: 350px; height: 350px; 
            background: var(--neon-orange); 
            top: 20%; right: 15%;
            animation-delay: -7s;
        }
        .blob-5 {
            width: 300px; height: 300px;
            background: var(--neon-pink);
            top: 85%; left: 60%;
            animation-delay: -3s;
            opacity: 0.15;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -40px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.95); }
        }

        /* Floating shapes for parallax */
        .float-shape {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
            will-change: transform;
        }
        .shape-1 { width: 80px; height: 80px; top: 15%; left: 10%; }
        .shape-2 { width: 40px; height: 40px; top: 35%; right: 8%; border-radius: 30%; }
        .shape-3 { width: 60px; height: 60px; top: 55%; left: 5%; border-radius: 20%; }
        .shape-4 { width: 100px; height: 100px; top: 75%; right: 12%; opacity: 0.5; }
        .shape-5 { width: 30px; height: 30px; top: 90%; left: 40%; border-radius: 40%; }

        /* Stars */
        .star {
            position: absolute;
            width: 3px; height: 3px;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            will-change: transform;
        }

        /* ===== CONTENT LAYER ===== */
        .content {
            position: relative;
            z-index: 2;
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 100;
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .back-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            border-color: transparent;
            box-shadow: 0 8px 30px rgba(255, 0, 110, 0.4);
        }

        /* ===== FOOTER ===== */
        .footer {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 20px 60px;
            color: rgba(255,255,255,0.3);
            font-size: 13px;
        }

        .footer-quote {
            font-style: italic;
            margin-bottom: 10px;
            font-size: 16px;
            color: rgba(255,255,255,0.5);
        }

        .footer-emoji {
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--neon-purple), var(--neon-pink));
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .back-btn { top: 15px; left: 15px; width: 45px; height: 45px; }
        }


        .hero-family {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 100px 20px 40px;
            will-change: transform, opacity;
        }

        .family-badge {
            display: inline-block;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .family-avatar-big {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin: 0 auto 25px;
            box-shadow: 0 15px 50px rgba(131, 56, 236, 0.4);
            animation: avatarPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 0.2s;
            opacity: 0;
            transform: scale(0);
        }

        @keyframes avatarPop {
            to { opacity: 1; transform: scale(1); }
        }

        .family-name-big {
            font-family: 'Great Vibes', cursive;
            font-size: 56px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-orange), var(--neon-cyan));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease infinite;
            margin-bottom: 8px;
            filter: drop-shadow(0 5px 15px rgba(255, 0, 110, 0.2));
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .family-role {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .info-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .info-pill {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;

            transition: all 0.3s ease;

        }

        .info-pill:hover {
            background: rgba(131, 56, 236, 0.1);
            border-color: rgba(131, 56, 236, 0.3);
            transform: translateY(-2px);
        }

        .children-section {
            position: relative;
            z-index: 2;
            padding: 40px 20px 60px;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            margin-bottom: 40px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .section-title::before,
        .section-title::after {
            content: '';
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan));
        }

        .section-title::after {
            background: linear-gradient(90deg, var(--neon-cyan), transparent);
        }

        .children-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .child-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: cardEntry 0.6s ease forwards;
            opacity: 0;
            transform: translateY(30px);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .child-card:nth-child(1) { animation-delay: 0.1s; }
        .child-card:nth-child(2) { animation-delay: 0.2s; }
        .child-card:nth-child(3) { animation-delay: 0.3s; }
        .child-card:nth-child(4) { animation-delay: 0.4s; }
        .child-card:nth-child(5) { animation-delay: 0.5s; }
        .child-card:nth-child(6) { animation-delay: 0.6s; }

        @keyframes cardEntry {
            to { opacity: 1; transform: translateY(0); }
        }

        .child-card:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: rgba(0, 245, 212, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 30px rgba(0, 245, 212, 0.1);
        }

        .child-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            background-size: 200% 100%;
            animation: borderGlow 3s linear infinite;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .child-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 15px;
            box-shadow: 0 8px 25px rgba(0, 245, 212, 0.2);
            transition: all 0.4s ease;
        }

        .child-card:hover .child-avatar {
            transform: scale(1.15) rotate(10deg);
            box-shadow: 0 12px 35px rgba(0, 245, 212, 0.3);
        }

        .child-name {
            font-size: 18px;
            font-weight: 700;
            color: rgba(255,255,255,0.95);
            transition: color 0.3s;
        }

        .child-card:hover .child-name {
            color: var(--neon-cyan);
        }

        @media (max-width: 768px) {
            .family-name-big { font-size: 40px; }
            .children-grid { grid-template-columns: 1fr; }
            .hero-family { padding-top: 80px; }
        }
    </style>
</head>

<script>
    function createConfetti(e) {
        const colors = ['#ff006e', '#8338ec', '#00f5d4', '#ff9f1c', '#fee440', '#ffffff'];
        for (let i = 0; i < 15; i++) {
            const confetti = document.createElement('div');
            confetti.style.cssText = `
                position: fixed;
                left: ${e.clientX}px;
                top: ${e.clientY}px;
                width: ${Math.random() * 8 + 4}px;
                height: ${Math.random() * 8 + 4}px;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                pointer-events: none;
                z-index: 9999;
                animation: confettiFall ${Math.random() * 0.5 + 1}s ease-out forwards;
            `;
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 1500);
        }
    }

    const confettiStyle = document.createElement('style');
    confettiStyle.textContent = `
        @keyframes confettiFall {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(${Math.random()*200-100}px, -300px) rotate(720deg) scale(0); opacity: 0; }
        }
    `;
    document.head.appendChild(confettiStyle);
</script>
<script>
    // ===== PARALLAX SCROLLING =====
    window.addEventListener('scroll', () => {
        const scrolled = window.pageYOffset;

        // Background grid moves very slow
        const grid = document.querySelector('.bg-grid');
        if (grid) grid.style.transform = `translateY(${scrolled * 0.1}px)`;

        // Blobs move at different speeds
        const blobs = document.querySelectorAll('.blob');
        blobs.forEach((blob, i) => {
            const speed = 0.15 + (i * 0.05);
            blob.style.transform = `translateY(${scrolled * speed}px)`;
        });

        // Float shapes move faster (foreground feel)
        const shapes = document.querySelectorAll('.float-shape');
        shapes.forEach((shape, i) => {
            const speed = 0.3 + (i * 0.1);
            shape.style.transform = `translateY(${scrolled * speed}px) rotate(${scrolled * 0.05}deg)`;
        });

        // Stars twinkle and move
        const stars = document.querySelectorAll('.star');
        stars.forEach((star, i) => {
            const speed = 0.2 + (i % 3) * 0.1;
            star.style.transform = `translateY(${scrolled * speed}px)`;
            star.style.opacity = 0.2 + Math.sin(scrolled * 0.01 + i) * 0.2;
        });

        // Hero parallax (moves up faster)
        const hero = document.querySelector('.hero, .hero-family');
        if (hero) {
            hero.style.transform = `translateY(${scrolled * 0.15}px)`;
            hero.style.opacity = 1 - (scrolled / 600);
        }
    });

    // Mouse parallax (subtle movement based on mouse)
    document.addEventListener('mousemove', (e) => {
        const mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        const mouseY = (e.clientY / window.innerHeight - 0.5) * 2;

        const blobs = document.querySelectorAll('.blob');
        blobs.forEach((blob, i) => {
            const strength = 10 + i * 5;
            blob.style.marginLeft = `${mouseX * strength}px`;
            blob.style.marginTop = `${mouseY * strength}px`;
        });
    });
</script>
